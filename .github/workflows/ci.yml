name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrations are in sync with the schema
        run: |
          npx drizzle-kit generate --name ci-check
          git status --porcelain drizzle | grep . && { echo "Run npm run db:generate and commit the migration."; exit 1; } || true
      - run: npm run build
        env:
          APP_URL: http://localhost:3000

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          APP_URL: http://localhost:3100
          BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-1234567890
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
